[project]
name = "mcp-server"
version = "0.1.0"
description = "Coffee shop chatbot built with Python, FastAPI, and MCP, featuring an MCP client and server for handling customer queries and coffee shop orders."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.1.1",
    "mcp>=1.26.0",
    "psycopg2-binary>=2.9.11",
    "sqlalchemy>=2.0.48",
]
